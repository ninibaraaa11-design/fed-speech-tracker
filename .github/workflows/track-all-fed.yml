name: Track All Fed Officials

on:
  workflow_dispatch:
  schedule:
    # 北京时间每天07:50。与原有07:30双人物监控分开运行。
    - cron: '50 23 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/track-all-fed.yml'

permissions:
  contents: write

concurrency:
  group: track-all-fed
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HTML parser
        run: python -m pip install 'beautifulsoup4>=4.12,<5'

      - name: Discover official speeches and extract evidence
        run: python scripts/update_all_fed.py
        # This step uses NO AI/API key. It only fetches public official webpages.

      - name: Save updated evidence data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/all_fed_officials.json
          if ! git diff --cached --quiet; then
            git commit -m "Update all Fed officials speech timeline"
            git push
          fi
