
name: Update Fed Speeches

on:
  schedule:
    # 北京时间每天07:30（UTC前一天23:30）
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fed-speech-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependency
        run: python -m pip install 'beautifulsoup4>=4.12,<5'

      - name: Check for new speeches
        run: python scripts/update_speeches.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update Fed speech data"
            git push
          fi
